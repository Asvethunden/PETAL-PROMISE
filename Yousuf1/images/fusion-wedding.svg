<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Fusion wedding floral wreath blending Eastern ornate geometry with Western roses and lilies">
  <defs>
    <linearGradient id="bgFusion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9F5"/>
      <stop offset="50%" stop-color="#F3D7DF"/>
      <stop offset="100%" stop-color="#ECEFE7"/>
    </linearGradient>
  </defs>
  <rect width="360" height="220" rx="16" fill="url(#bgFusion)"/>
  <!-- Geometric diamond frame -->
  <rect x="116" y="46" width="128" height="128" rx="18" transform="rotate(45 180 110)" fill="#FFF9F5" fill-opacity="0.72" stroke="#D49AA8" stroke-width="2.2"/>
  <circle cx="180" cy="110" r="64" fill="none" stroke="#A3AC96" stroke-width="2.2"/>
  <!-- Center rose and lily union -->
  <g transform="translate(180, 110)">
    <ellipse cx="-30" cy="16" rx="18" ry="7" transform="rotate(-28 -30 16)" fill="#A3AC96"/>
    <ellipse cx="30" cy="16" rx="18" ry="7" transform="rotate(28 30 16)" fill="#A3AC96"/>
    <!-- Lily rays -->
    <path d="M0 -34 C9 -18 9 -4 0 4 C-9 -4 -9 -18 0 -34 Z" fill="#FFF9F5" stroke="#554A45" stroke-width="1.2"/>
    <path d="M-30 -10 C-14 -16 -2 -12 4 0 C-6 8 -18 4 -30 -10 Z" fill="#FFF9F5" stroke="#554A45" stroke-width="1.2"/>
    <path d="M30 -10 C18 4 6 8 -4 0 C2 -12 14 -16 30 -10 Z" fill="#FFF9F5" stroke="#554A45" stroke-width="1.2"/>
    <!-- Rose core -->
    <circle cx="0" cy="6" r="19" fill="#D49AA8"/>
    <circle cx="-2" cy="4" r="12" fill="#F3D7DF"/>
    <path d="M-6 4 C-6 -2 6 -2 6 5 C6 11 -4 12 -6 7" fill="none" stroke="#554A45" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Corner accent buds -->
  <circle cx="98" cy="110" r="8" fill="#D49AA8" opacity="0.85"/>
  <circle cx="262" cy="110" r="8" fill="#A3AC96" opacity="0.85"/>
  <circle cx="180" cy="30" r="6" fill="#F3D7DF" stroke="#554A45" stroke-width="1.1"/>
  <circle cx="180" cy="190" r="6" fill="#F3D7DF" stroke="#554A45" stroke-width="1.1"/>
</svg>
